version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: allergyfree_db
    environment:
      POSTGRES_USER: allergy_admin
      POSTGRES_PASSWORD: allergy_password
      POSTGRES_DB: allergyfree_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    restart: unless-stopped

volumes:
  postgres_data:
