<!DOCTYPE html>
<html class="light" lang="ko">
<head>
  <meta charset="utf-8"/>
  <title>AllergyFree - 주변 안전 음식점</title>
  <link rel="icon" type="image/png" href="/image/icon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <script src="../js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=94722c4b189b85fe7f30fbf76715b478&libraries=services"></script>
  <script src="../js/auth.js" defer></script>
</head>
<body class="bg-background text-on-surface font-body-md overflow-hidden h-screen flex flex-col">
  <!-- TopAppBar -->
  <header class="fixed top-0 left-0 w-full z-50 bg-surface dark:bg-surface-dim shadow-sm">
    <div class="max-w-container-max mx-auto w-full flex justify-between items-center px-margin-mobile py-sm">
      <div class="flex items-center gap-sm">
        <span class="material-symbols-outlined text-primary cursor-pointer active:scale-95 transition-transform" data-icon="arrow_back">arrow_back</span>
        <span class="text-headline-lg font-headline-lg font-bold text-primary dark:text-inverse-primary">AllergyFree</span>
      </div>
      <div class="hidden md:flex flex-1 max-w-xl mx-lg relative">
        <input class="w-full bg-surface-container-low border-none rounded-full px-lg py-sm text-body-md focus:ring-2 focus:ring-primary-container" placeholder="상품명 또는 바코드 검색" type="text" id="map-header-search"/>
        <span class="material-symbols-outlined absolute right-4 top-2 text-outline cursor-pointer" data-icon="search">search</span>
      </div>
      <div class="flex items-center gap-md">
        <a href="/shop" class="text-primary font-bold hover:underline px-xs text-body-md flex items-center gap-xs">
          <span class="material-symbols-outlined">shopping_basket</span>
          <span class="hidden sm:inline">쇼핑몰</span>
        </a>
        <a href="/cart" class="relative cursor-pointer active:scale-95 transition-transform text-primary flex items-center justify-center p-1 rounded-full hover:bg-surface-container-high">
          <span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
          <span id="cart-badge" class="absolute -top-1 -right-1 bg-error text-on-error text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full hidden">0</span>
        </a>
        <button class="cursor-pointer active:scale-95 transition-transform text-primary">
          <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
        </button>
        <button id="header-profile-btn" class="cursor-pointer active:scale-95 transition-transform text-primary">
          <span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container: Map taking full remaining height -->
  <main class="flex-1 pt-[72px] relative flex flex-col md:flex-row h-full overflow-hidden">
    <!-- Left Sidebar for Search Controls & List (Desktop only / hidden on Mobile) -->
    <aside class="hidden md:flex md:w-96 flex-col bg-surface border-r border-outline-variant h-full z-10 overflow-hidden shadow-md">
      <!-- Search & Controls Section -->
      <div class="p-md border-b border-outline-variant space-y-md shrink-0">
        <h2 class="font-headline-md text-headline-md text-primary font-bold flex items-center gap-sm">
          <span class="material-symbols-outlined text-[24px]">location_on</span>
          주변 안전 음식점
        </h2>
        
        <!-- Address Search -->
        <div class="space-y-xs">
          <label class="block text-label-sm text-outline font-semibold">위치 검색</label>
          <div class="flex gap-xs">
            <input type="text" id="sidebar-address-input" placeholder="도로명 또는 지번 주소 입력" 
              class="flex-1 bg-surface-container-low border border-outline rounded-lg px-md py-sm text-body-sm focus:ring-2 focus:ring-primary focus:outline-none transition-all"/>
            <button id="sidebar-address-btn" class="bg-primary hover:bg-opacity-95 text-on-primary px-md py-sm rounded-lg font-label-md transition-all active:scale-95 text-xs">
              검색
            </button>
          </div>
        </div>

        <!-- Radius & Actions -->
        <div class="flex items-center justify-between gap-sm pt-xs">
          <div class="flex flex-col gap-xs flex-1">
            <span class="text-label-sm text-outline font-semibold">검색 반경</span>
            <div class="flex bg-surface-container-high rounded-lg p-0.5 w-full">
              <button class="radius-toggle-btn flex-1 py-1 text-xs font-bold rounded-md bg-white shadow-sm text-primary transition-all" data-radius="50">50m</button>
              <button class="radius-toggle-btn flex-1 py-1 text-xs font-bold rounded-md text-on-surface-variant transition-all" data-radius="100">100m</button>
              <button class="radius-toggle-btn flex-1 py-1 text-xs font-bold rounded-md text-on-surface-variant transition-all" data-radius="200">200m</button>
            </div>
          </div>
          <button id="sidebar-gps-btn" class="border border-primary text-primary bg-white hover:bg-primary/5 p-2 rounded-lg flex items-center justify-center active:scale-95 transition-all self-end h-[36px]" title="내 현재 위치">
            <span class="material-symbols-outlined text-[20px]">my_location</span>
          </button>
        </div>
      </div>

      <!-- Restaurant List Section -->
      <div id="restaurant-list-container" class="flex-1 overflow-y-auto p-md space-y-md bg-surface-container-lowest">
        <p class="text-center py-xl text-outline text-body-sm italic">지도를 스캔하여 식당 정보를 조회하고 있습니다...</p>
      </div>
    </aside>

    <!-- Map Area (Center / Right) -->
    <div class="flex-1 h-full relative" id="map-container">
      <!-- Kakao Map Mount point -->
      <div id="map" class="w-full h-full"></div>

      <!-- Mobile Top Control Overlay (Floating bar) -->
      <div class="absolute top-4 left-4 right-4 z-10 md:hidden bg-white/90 backdrop-blur-md p-md rounded-2xl border border-outline-variant/30 shadow-lg space-y-md">
        <div class="flex gap-xs">
          <input type="text" id="mobile-address-input" placeholder="도로명 또는 지번 주소 입력" 
            class="flex-1 bg-surface-container-low border border-outline rounded-xl px-md py-sm text-body-sm focus:ring-2 focus:ring-primary focus:outline-none transition-all"/>
          <button id="mobile-address-btn" class="bg-primary text-on-primary px-lg py-sm rounded-xl font-label-md active:scale-95 transition-all">
            검색
          </button>
          <button id="mobile-gps-btn" class="bg-surface-container-high border border-outline-variant p-2 rounded-xl flex items-center justify-center active:scale-95 transition-all">
            <span class="material-symbols-outlined text-[20px] text-primary">my_location</span>
          </button>
        </div>
        <div class="flex items-center justify-between gap-sm pt-xs border-t border-outline-variant/10">
          <span class="text-label-sm text-outline font-bold">검색 반경</span>
          <div class="flex bg-surface-container-high rounded-xl p-0.5 w-44">
            <button class="radius-toggle-btn flex-1 py-1 text-xs font-bold rounded-lg bg-white shadow-sm text-primary transition-all" data-radius="50">50m</button>
            <button class="radius-toggle-btn flex-1 py-1 text-xs font-bold rounded-lg text-on-surface-variant transition-all" data-radius="100">100m</button>
            <button class="radius-toggle-btn flex-1 py-1 text-xs font-bold rounded-lg text-on-surface-variant transition-all" data-radius="200">200m</button>
          </div>
        </div>
      </div>

      <!-- "Re-scan this location" Button overlay (shows when map centers changes) -->
      <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 hidden" id="rescan-btn-container">
        <button id="rescan-btn" class="bg-primary text-on-primary px-lg py-md rounded-full font-label-lg shadow-lg active:scale-95 hover:bg-opacity-95 transition-all flex items-center gap-xs">
          <span class="material-symbols-outlined text-[20px]">refresh</span>
          이 위치에서 검색하기
        </button>
      </div>

      <!-- Mobile Bottom Modal Drawer (Slides up when restaurant is selected / hidden on Desktop) -->
      <div class="absolute bottom-4 left-4 right-4 z-20 bg-white/95 backdrop-blur-md rounded-2xl border border-outline-variant/30 shadow-xl p-lg transform translate-y-full transition-transform duration-300 md:hidden flex flex-col max-h-[60%] overflow-hidden" id="mobile-detail-drawer">
        <!-- Close Handle -->
        <div class="flex justify-between items-start mb-sm border-b border-outline-variant/10 pb-sm shrink-0">
          <div>
            <h3 class="font-headline-md text-on-surface font-bold text-base" id="drawer-title">식당명</h3>
            <p class="text-body-sm text-outline" id="drawer-category">카테고리</p>
          </div>
          <button id="close-drawer-btn" class="text-outline hover:text-on-surface p-1 rounded-full hover:bg-surface-container-high">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <!-- Scrollable content -->
        <div class="flex-1 overflow-y-auto space-y-md py-sm" id="drawer-menu-content">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Floating List Button for Mobile -->
      <button id="mobile-list-toggle-btn" class="absolute bottom-6 right-4 z-10 md:hidden bg-primary text-on-primary px-lg py-md rounded-full font-label-lg shadow-lg active:scale-95 hover:bg-opacity-95 transition-all flex items-center gap-xs hidden">
        <span class="material-symbols-outlined text-[20px]">list</span>
        목록 보기
      </button>

      <!-- Mobile Restaurant List Drawer (Slides up when button is clicked / hidden on Desktop) -->
      <div class="absolute bottom-4 left-4 right-4 z-20 bg-white/95 backdrop-blur-md rounded-2xl border border-outline-variant/30 shadow-xl p-lg transform translate-y-full transition-transform duration-300 md:hidden flex flex-col max-h-[60%] overflow-hidden" id="mobile-list-drawer">
        <!-- Header -->
        <div class="flex justify-between items-center mb-sm border-b border-outline-variant/10 pb-sm shrink-0">
          <div>
            <h3 class="font-headline-md text-on-surface font-bold text-base">주변 식당 목록</h3>
            <p class="text-body-sm text-outline" id="mobile-list-count">검색된 식당 0개</p>
          </div>
          <button id="close-list-drawer-btn" class="text-outline hover:text-on-surface p-1 rounded-full hover:bg-surface-container-high">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <!-- Scrollable list -->
        <div class="flex-1 overflow-y-auto space-y-md py-sm" id="mobile-list-content">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </main>

  <!-- Map Application Logic -->
  <script>
    // Global Error Logger for robust debugging
    window.onerror = function(message, source, lineno, colno, error) {
      console.error("JS Error caught:", message, "at", source, ":", lineno);
      alert("지도 연동 에러 발생: " + message + " (라인: " + lineno + ")\\n카카오 콘솔 도메인 등록을 마쳤는지 확인해 주세요.");
    };

    let map = null;
    let centerMarker = null;
    let radiusCircle = null;
    let selectedRadius = 50; // 50m default
    let searchLatLng = null; // Current search origin coordinate
    let markers = []; // Array of currently drawn place markers
    let currentPlaces = []; // Array of currently fetched/analyzed places
    let selectedPlaceId = null;
    let userAllergiesList = [];

    // Colored pin SVG data URLs for Kakao Map markers
    const MARKER_ICONS = {
      safe: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36"><path fill="%2324d27a" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>',
      caution: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36"><path fill="%23fbc02d" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>',
      unsafe: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36"><path fill="%23e53935" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>',
      unknown: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36"><path fill="%2378909c" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>'
    };

    /**
     * Map Page Initialization (Invoked by auth.js)
     */
    function initMapPage(userAllergies) {
      userAllergiesList = userAllergies;
      
      // Require login validation
      const token = localStorage.getItem('token');
      if (!token) {
        alert('로그인이 필요한 서비스입니다. 로그인을 진행해 주세요.');
        window.location.href = '/';
        return;
      }

      // Check if Kakao Maps SDK is loaded
      if (typeof kakao === 'undefined' || !kakao.maps) {
        // Render a friendly error UI in the map container
        const mapContainer = document.getElementById('map');
        if (mapContainer) {
          mapContainer.innerHTML = `
            <div class="flex flex-col items-center justify-center h-full p-6 text-center bg-gray-50 dark:bg-gray-900">
              <span class="material-symbols-outlined text-[48px] text-red-500 mb-4 animate-bounce">map</span>
              <h3 class="text-lg font-bold text-gray-800 dark:text-gray-100 mb-2">지도 라이브러리 로드 실패</h3>
              <p class="text-sm text-gray-600 dark:text-gray-400 mb-4 max-w-sm leading-relaxed">
                카카오 지도 API를 불러올 수 없습니다. 카카오 개발자 센터에서 Web 플랫폼 도메인에 <code class="bg-gray-200 dark:bg-gray-800 px-1 py-0.5 rounded font-mono text-xs text-red-600 font-bold">http://localhost:3000</code>이 등록되어 있는지 확인해주세요.
              </p>
              <a href="https://developers.kakao.com/" target="_blank" class="px-4 py-2 bg-green-700 hover:bg-green-800 text-white rounded-lg text-sm font-semibold transition-all shadow-md">
                카카오 개발자 센터 바로가기
              </a>
            </div>
          `;
        }
        
        // Render error state on sidebar list container as well
        const listContainer = document.getElementById('restaurant-list-container');
        if (listContainer) {
          listContainer.innerHTML = `
            <div class="p-4 border border-red-200 bg-red-50 rounded-xl space-y-2">
              <p class="text-xs text-red-800 font-semibold flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">warning</span>
                API 로드 오류
              </p>
              <p class="text-xs text-red-700 leading-relaxed">
                지도가 정상적으로 로드되지 않아 위치 검색 및 반경 분석 기능을 사용할 수 없습니다.
              </p>
            </div>
          `;
        }
        
        // Bind fallback alerts to buttons instead of regular handlers
        setupFallbackMapDom();
        return;
      }

      setupMapDom();
      initKakaoMap();
      setupLocationServices();
    }

    /**
     * Fallback handlers when Kakao SDK is not loaded
     */
    function setupFallbackMapDom() {
      const handleFallbackAlert = () => {
        alert('카카오 지도 API가 정상적으로 로드되지 않았습니다.\\n카카오 개발자 센터에서 http://localhost:3000 도메인을 등록했는지 확인해 주세요.');
      };

      // Bind to address search and GPS buttons
      const buttons = [
        'sidebar-address-btn', 'mobile-address-btn',
        'sidebar-gps-btn', 'mobile-gps-btn', 'rescan-btn'
      ];
      
      buttons.forEach(id => {
        const btn = document.getElementById(id);
        if (btn) {
          // Clone and replace to clear existing listeners if any
          const newBtn = btn.cloneNode(true);
          btn.parentNode.replaceChild(newBtn, btn);
          newBtn.addEventListener('click', handleFallbackAlert);
        }
      });
      
      // Also intercept keypresses on inputs
      ['sidebar-address-input', 'mobile-address-input'].forEach(id => {
        const input = document.getElementById(id);
        if (input) {
          const newInput = input.cloneNode(true);
          input.parentNode.replaceChild(newInput, input);
          newInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleFallbackAlert();
          });
        }
      });
    }

    /**
     * Configure Event bindings and layout structures
     */
    function setupMapDom() {
      // Bind radius selectors
      document.querySelectorAll('.radius-toggle-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.radius-toggle-btn').forEach(b => {
            b.classList.remove('bg-white', 'shadow-sm', 'text-primary');
            b.classList.add('text-on-surface-variant');
          });
          
          const radiusVal = parseInt(e.target.getAttribute('data-radius'));
          
          // Match selected radius button in both sidebar and mobile header
          document.querySelectorAll(`.radius-toggle-btn[data-radius="${radiusVal}"]`).forEach(matchBtn => {
            matchBtn.classList.remove('text-on-surface-variant');
            matchBtn.classList.add('bg-white', 'shadow-sm', 'text-primary');
          });
          
          selectedRadius = radiusVal;
          if (searchLatLng) {
            updateSearchCenter(searchLatLng);
            triggerPlacesSearch();
          }
        });
      });

      // Bind Address Search triggers
      const handleAddressSearch = (inputId) => {
        const query = document.getElementById(inputId).value.trim();
        if (!query) {
          alert('주소 또는 장소명을 입력하세요.');
          return;
        }
        
        // 1. Try Address Search first (Geocoder)
        const geocoder = new kakao.maps.services.Geocoder();
        geocoder.addressSearch(query, (result, status) => {
          if (status === kakao.maps.services.Status.OK) {
            const loc = new kakao.maps.LatLng(result[0].y, result[0].x);
            map.setCenter(loc);
            updateSearchCenter(loc);
            triggerPlacesSearch();
          } else {
            // 2. Fallback to Keyword Search (Places) if Address Search fails
            let ps;
            try {
              ps = new kakao.maps.services.Places();
            } catch (err) {
              console.error("Failed to init Places for search:", err);
              alert('검색 서비스 초기화에 실패했습니다.');
              return;
            }
            
            ps.keywordSearch(query, (keywordResult, keywordStatus) => {
              if (keywordStatus === kakao.maps.services.Status.OK && keywordResult && keywordResult.length > 0) {
                // Take the top matched place result
                const topPlace = keywordResult[0];
                const loc = new kakao.maps.LatLng(topPlace.y, topPlace.x);
                
                // Update input text to the searched place name for clarity
                const inputEl = document.getElementById(inputId);
                if (inputEl) {
                  inputEl.value = topPlace.place_name;
                }
                
                map.setCenter(loc);
                updateSearchCenter(loc);
                triggerPlacesSearch();
              } else {
                alert('검색 결과가 존재하지 않습니다. 주소 또는 장소명을 확인해 주세요.');
              }
            });
          }
        });
      };

      document.getElementById('sidebar-address-btn').addEventListener('click', () => handleAddressSearch('sidebar-address-input'));
      document.getElementById('sidebar-address-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleAddressSearch('sidebar-address-input');
      });

      document.getElementById('mobile-address-btn').addEventListener('click', () => handleAddressSearch('mobile-address-input'));
      document.getElementById('mobile-address-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleAddressSearch('mobile-address-input');
      });

      // Bind GPS fetch buttons
      const handleGpsFetch = () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const loc = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
              map.setCenter(loc);
              updateSearchCenter(loc);
              triggerPlacesSearch();
            },
            (err) => {
              alert('현재 위치 정보를 가져오는 중 에러가 발생했습니다: ' + err.message);
            }
          );
        } else {
          alert('브라우저가 위치정보 조회를 지원하지 않습니다.');
        }
      };
      
      document.getElementById('sidebar-gps-btn').addEventListener('click', handleGpsFetch);
      document.getElementById('mobile-gps-btn').addEventListener('click', handleGpsFetch);

      // Re-scan center button overlay
      document.getElementById('rescan-btn').addEventListener('click', () => {
        const center = map.getCenter();
        updateSearchCenter(center);
        triggerPlacesSearch();
      });

      // Close mobile drawer handle
      document.getElementById('close-drawer-btn').addEventListener('click', () => {
        document.getElementById('mobile-detail-drawer').classList.add('translate-y-full');
      });

      // Bind mobile list toggle button
      document.getElementById('mobile-list-toggle-btn').addEventListener('click', () => {
        const mobileListDrawer = document.getElementById('mobile-list-drawer');
        mobileListDrawer.classList.remove('translate-y-full');
        // Hide detail drawer if open
        document.getElementById('mobile-detail-drawer').classList.add('translate-y-full');
      });

      // Close mobile list drawer handle
      document.getElementById('close-list-drawer-btn').addEventListener('click', () => {
        document.getElementById('mobile-list-drawer').classList.add('translate-y-full');
      });
    }

    /**
     * Create the Map canvas
     */
    function initKakaoMap() {
      const container = document.getElementById('map');
      
      // Default: Seoul City Hall coordinates
      const defaultLoc = new kakao.maps.LatLng(37.566826, 126.9786567);
      
      const options = {
        center: defaultLoc,
        level: 3
      };
      
      map = new kakao.maps.Map(container, options);
      
      // Track map dragging changes to display the "Re-scan" overlay button
      kakao.maps.event.addListener(map, 'dragend', function() {
        const rescanContainer = document.getElementById('rescan-btn-container');
        rescanContainer.classList.remove('hidden');
      });

      updateSearchCenter(defaultLoc);
    }

    /**
     * Set up Geolocation or default location search trigger
     */
    function setupLocationServices() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const loc = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
            map.setCenter(loc);
            updateSearchCenter(loc);
            triggerPlacesSearch();
          },
          (err) => {
            console.log('Using default location (Seoul City Hall) because Geolocation denied or failed.');
            triggerPlacesSearch();
          }
        );
      } else {
        triggerPlacesSearch();
      }
    }

    /**
     * Update center marker, circle overlay bounds
     */
    function updateSearchCenter(latLng) {
      searchLatLng = latLng;
      document.getElementById('rescan-btn-container').classList.add('hidden');

      // 1. Center Marker (Special pulsing search marker / Blue point)
      if (!centerMarker) {
        const markerImageSrc = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="8" fill="%230f683d" stroke="white" stroke-width="2"/><circle cx="12" cy="12" r="10" fill="%230f683d" fill-opacity="0.15"/></svg>';
        const markerImageSize = new kakao.maps.Size(24, 24);
        const markerImage = new kakao.maps.MarkerImage(markerImageSrc, markerImageSize, {
          offset: new kakao.maps.Point(12, 12)
        });

        centerMarker = new kakao.maps.Marker({
          position: latLng,
          image: markerImage,
          map: map
        });
      } else {
        centerMarker.setPosition(latLng);
      }

      // 2. Search Radius Circle overlay
      if (!radiusCircle) {
        radiusCircle = new kakao.maps.Circle({
          center: latLng,
          radius: selectedRadius,
          strokeWeight: 1.5,
          strokeColor: '#0f683d',
          strokeOpacity: 0.8,
          strokeStyle: 'dashed',
          fillColor: '#0f683d',
          fillOpacity: 0.05
        });
        radiusCircle.setMap(map);
      } else {
        radiusCircle.setOptions({
          center: latLng,
          radius: selectedRadius
        });
      }
    }

    /**
     * Calculate geodesic distance between two points in meters using Haversine formula
     */
    function getDistance(lat1, lng1, lat2, lng2) {
      const R = 6371e3; // Earth radius in meters
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; // distance in meters
    }

    /**
     * Query Kakao Map Places database and analyze results (handles multi-page fetching to show complete radius)
     */
    function triggerPlacesSearch() {
      // 1. Clear previous search states immediately to prevent UI leaks
      clearMarkers();
      currentPlaces = [];
      selectedPlaceId = null;

      // Close detail drawers/cards if open
      const desktopCard = document.getElementById('desktop-detail-card');
      if (desktopCard) {
        desktopCard.classList.add('hidden');
      }
      const mobileDrawer = document.getElementById('mobile-detail-drawer');
      if (mobileDrawer) {
        mobileDrawer.classList.add('translate-y-full');
      }

      // Clear previous list UI with loading text
      const listContainer = document.getElementById('restaurant-list-container');
      if (listContainer) {
        listContainer.innerHTML = `<p class="text-center py-xl text-outline text-body-sm italic">주변 식당 목록을 스캔하고 있습니다...</p>`;
      }

      // Safeguard for searchLatLng existence
      if (!searchLatLng) {
        console.error("searchLatLng is not defined yet.");
        if (listContainer) {
          listContainer.innerHTML = `<p class="text-center py-xl text-error text-body-sm italic">현재 위치 정보를 알 수 없습니다.</p>`;
        }
        return;
      }

      // Determine how many pages to fetch based on radius to get all places
      // 50m: 1 page (up to 15 items), 100m: 2 pages (up to 30 items), 200m: 3 pages (up to 45 items)
      const maxPages = selectedRadius <= 50 ? 1 : (selectedRadius <= 100 ? 2 : 3);
      let allPlaces = [];
      
      let ps;
      try {
        ps = new kakao.maps.services.Places();
      } catch (err) {
        console.error("Failed to initialize Kakao Places service:", err);
        if (listContainer) {
          listContainer.innerHTML = `<p class="text-center py-xl text-error text-body-sm italic">지도 서비스를 사용할 수 없는 상태입니다.</p>`;
        }
        return;
      }
      
      const options = {
        location: searchLatLng,
        radius: selectedRadius,
        sort: kakao.maps.services.SortBy.DISTANCE
      };

      function fetchPage(page) {
        options.page = page;
        ps.categorySearch('FD6', (data, status, pagination) => {
          if (status === kakao.maps.services.Status.OK) {
            if (data && Array.isArray(data)) {
              allPlaces = allPlaces.concat(data);
            }
            
            // If there is a next page and we haven't reached maxPages, fetch next
            if (pagination && pagination.hasNextPage && page < maxPages) {
              fetchPage(page + 1);
            } else {
              // Fetching complete. Filter and process places
              processAndAnalyzePlaces(allPlaces);
            }
          } else if (status === kakao.maps.services.Status.ZERO_RESULT && page === 1) {
            if (listContainer) {
              listContainer.innerHTML = `<p class="text-center py-xl text-outline text-body-sm italic">선택하신 반경 내에 음식점이 존재하지 않습니다.</p>`;
            }
          } else {
            // If we have some pages, still process them
            if (allPlaces.length > 0) {
              processAndAnalyzePlaces(allPlaces);
            } else {
              if (listContainer) {
                listContainer.innerHTML = `<p class="text-center py-xl text-error text-body-sm italic">식당 목록 검색 중 오류가 발생했습니다.</p>`;
              }
            }
          }
        }, options);
      }

      fetchPage(1);
    }

    /**
     * Deduplicate, filter by precise radius distance, sort, and send to backend
     */
    function processAndAnalyzePlaces(places) {
      if (!places || !Array.isArray(places)) return;

      // 1. Deduplicate by place ID
      const uniquePlacesMap = new Map();
      places.forEach(p => {
        if (p && p.id) {
          uniquePlacesMap.set(p.id, p);
        }
      });
      const uniquePlaces = Array.from(uniquePlacesMap.values());

      // 2. Filter by precise distance using Haversine formula
      const filteredPlaces = uniquePlaces.map(p => {
        if (!p || !p.x || !p.y) return null;
        
        try {
          const dist = getDistance(
            searchLatLng.getLat(),
            searchLatLng.getLng(),
            parseFloat(p.y),
            parseFloat(p.x)
          );
          return {
            ...p,
            calculatedDistance: Math.round(dist)
          };
        } catch (e) {
          console.error("Distance calculation failed for place:", p, e);
          return null;
        }
      }).filter(p => p !== null && p.calculatedDistance <= selectedRadius);

      // 3. Sort by distance ascending
      filteredPlaces.sort((a, b) => a.calculatedDistance - b.calculatedDistance);

      const listContainer = document.getElementById('restaurant-list-container');

      if (filteredPlaces.length === 0) {
        if (listContainer) {
          listContainer.innerHTML = `<p class="text-center py-xl text-outline text-body-sm italic">선택하신 반경 내에 음식점이 존재하지 않습니다.</p>`;
        }
        return;
      }

      // 4. Send to backend for allergy analysis
      analyzePlacesOnBackend(filteredPlaces);
    }

    /**
     * Send Kakao places raw results to NestJS backend to cross-reference menu data
     */
    async function analyzePlacesOnBackend(rawPlaces) {
      const token = localStorage.getItem('token');
      const formattedPlaces = rawPlaces.map(p => ({
        id: p.id,
        place_name: p.place_name,
        category_name: p.category_name,
        x: p.x,
        y: p.y,
        address_name: p.address_name,
        place_url: p.place_url,
        distance: p.calculatedDistance || p.distance // Use the precisely calculated distance
      }));

      try {
        const response = await fetch(`${API_URL}/restaurants/analyze-safe`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ places: formattedPlaces })
        });

        if (!response.ok) {
          throw new Error('Backend safe restaurant analyze request failed');
        }

        const analyzedPlaces = await response.json();
        // Map backend property names (place_name, category_name) to frontend friendly properties (name, category)
        currentPlaces = analyzedPlaces.map(p => ({
          ...p,
          name: p.place_name || p.name,
          category: p.category_name || p.category
        }));
        
        renderPlacesOnMapAndList();
      } catch (err) {
        console.error(err);
        clearMarkers();
        currentPlaces = [];
        const listContainer = document.getElementById('restaurant-list-container');
        if (listContainer) {
          listContainer.innerHTML = `
            <p class="text-center py-xl text-error text-body-sm italic">알레르기 안전성 분석 중 통신 실패가 발생했습니다.</p>
          `;
        }
      }
    }

    /**
     * Clear all current pins on map
     */
    function clearMarkers() {
      markers.forEach(m => m.setMap(null));
      markers = [];
    }

    /**
     * Render analyzed places onto Kakao Map as color-coded pins, and compile the sidebar list
     */
    function renderPlacesOnMapAndList() {
      clearMarkers();
      
      const listContainer = document.getElementById('restaurant-list-container');
      listContainer.innerHTML = '';

      const mobileListContent = document.getElementById('mobile-list-content');
      if (mobileListContent) {
        mobileListContent.innerHTML = '';
      }

      const mobileListCount = document.getElementById('mobile-list-count');
      if (mobileListCount) {
        mobileListCount.innerText = `검색된 식당 ${currentPlaces.length}개`;
      }

      const mobileListToggleBtn = document.getElementById('mobile-list-toggle-btn');
      if (mobileListToggleBtn) {
        if (currentPlaces.length > 0) {
          mobileListToggleBtn.classList.remove('hidden');
        } else {
          mobileListToggleBtn.classList.add('hidden');
        }
      }
      
      if (currentPlaces.length === 0) {
        listContainer.innerHTML = `<p class="text-center py-xl text-outline text-body-sm italic">선택 반경 내 음식점 결과가 없습니다.</p>`;
        if (mobileListContent) {
          mobileListContent.innerHTML = `<p class="text-center py-xl text-outline text-body-sm italic">검색된 결과가 없습니다.</p>`;
        }
        return;
      }

      currentPlaces.forEach(place => {
        // 1. Create Kakao Map Marker
        const latLng = new kakao.maps.LatLng(place.y, place.x);
        
        let safetyKey = place.safety; // 'safe' | 'caution' | 'unsafe'
        if (!place.hasMenuData && place.safety === 'safe') {
          safetyKey = 'unknown'; // Grey pin if no menu exists but category fallback says okay
        }

        const pinSvg = MARKER_ICONS[safetyKey] || MARKER_ICONS.unknown;
        const markerImage = new kakao.maps.MarkerImage(pinSvg, new kakao.maps.Size(36, 36), {
          offset: new kakao.maps.Point(18, 36)
        });

        const marker = new kakao.maps.Marker({
          position: latLng,
          image: markerImage,
          title: place.name,
          map: map
        });

        markers.push(marker);

        // Bind marker click event
        kakao.maps.event.addListener(marker, 'click', () => {
          selectPlace(place);
        });

        // 2. Add to Sidebar List Card (Desktop)
        const listCard = document.createElement('div');
        listCard.className = `p-md rounded-xl border transition-all cursor-pointer select-none relative ${
          selectedPlaceId === place.id 
            ? 'bg-primary-container/10 border-primary ring-1 ring-primary' 
            : 'bg-white border-outline-variant hover:border-primary/50'
        }`;
        
        let badgeHtml = '';
        if (place.safety === 'safe') {
          badgeHtml = `<span class="bg-[#24d27a]/20 text-[#0f683d] text-[10px] font-bold px-sm py-0.5 rounded-full flex items-center gap-xs"><span class="material-symbols-outlined text-[12px] font-bold">check_circle</span>안전한 식당</span>`;
        } else if (place.safety === 'caution') {
          badgeHtml = `<span class="bg-[#fbc02d]/20 text-[#a07800] text-[10px] font-bold px-sm py-0.5 rounded-full flex items-center gap-xs"><span class="material-symbols-outlined text-[12px] font-bold">warning</span>일부 대안 가능</span>`;
        } else {
          badgeHtml = `<span class="bg-[#e53935]/20 text-[#c62828] text-[10px] font-bold px-sm py-0.5 rounded-full flex items-center gap-xs"><span class="material-symbols-outlined text-[12px] font-bold">cancel</span>섭취 불가</span>`;
        }

        const cardInner = `
          <div class="flex justify-between items-start gap-xs">
            <h4 class="font-headline-sm text-on-surface font-bold truncate pr-md text-[14px]">${place.name}</h4>
            ${badgeHtml}
          </div>
          <p class="text-[10px] text-outline mt-xs truncate">${place.category}</p>
          <div class="flex justify-between items-center mt-sm pt-xs border-t border-outline-variant/10 text-[11px] text-on-surface-variant">
            <span class="flex items-center gap-1 font-mono"><span class="material-symbols-outlined text-[14px] text-outline">near_me</span>${place.distance}m</span>
            <a href="${place.place_url}" target="_blank" class="text-primary font-bold hover:underline flex items-center gap-1" onclick="event.stopPropagation();">
              카카오맵 크게보기<span class="material-symbols-outlined text-[12px]">open_in_new</span>
            </a>
          </div>
        `;
        listCard.innerHTML = cardInner;

        listCard.addEventListener('click', () => {
          map.panTo(latLng);
          selectPlace(place);
        });

        listContainer.appendChild(listCard);

        // 3. Add to Mobile List Card (Mobile)
        if (mobileListContent) {
          const mobileListCard = document.createElement('div');
          mobileListCard.className = `p-md rounded-xl border transition-all cursor-pointer select-none relative ${
            selectedPlaceId === place.id 
              ? 'bg-primary-container/10 border-primary ring-1 ring-primary' 
              : 'bg-white border-outline-variant hover:border-primary/50'
          }`;
          mobileListCard.innerHTML = cardInner;
          mobileListCard.addEventListener('click', () => {
            map.panTo(latLng);
            selectPlace(place);
            const mobileListDrawer = document.getElementById('mobile-list-drawer');
            if (mobileListDrawer) {
              mobileListDrawer.classList.add('translate-y-full');
            }
          });
          mobileListContent.appendChild(mobileListCard);
        }
      });
    }

    /**
     * Handle place selection (opens drawer/cards)
     */
    function selectPlace(place) {
      selectedPlaceId = place.id;
      
      // Rerender list to highlight the active card
      renderPlacesOnMapAndList();

      // Get menu list details HTML
      const menusHtml = generateMenusHtml(place);

      // Display Sidebar detailed info card (for desktop) or slide up the bottom drawer (for mobile)
      
      // Desktop Sidebar injection:
      // If we are on desktop, we show details inside the listContainer or in a floating card. Let's make it look beautiful:
      // Since screen size is handled, we will fill the mobile drawer and show it.
      
      // 1. Mobile Drawer Populate & Slide-up
      document.getElementById('drawer-title').innerText = place.name;
      document.getElementById('drawer-category').innerText = `${place.category} (거리: ${place.distance}m)`;
      document.getElementById('drawer-menu-content').innerHTML = menusHtml;
      
      const drawer = document.getElementById('mobile-detail-drawer');
      drawer.classList.remove('translate-y-full');

      // Close mobile list drawer when showing restaurant detail drawer
      const listDrawer = document.getElementById('mobile-list-drawer');
      if (listDrawer) {
        listDrawer.classList.add('translate-y-full');
      }

      // 2. Desktop sidebar detail option
      // Let's also display the detailed menus overlay in the sidebar for desktop users.
      // We can insert a toggleable menu list details modal, or inject it right under the list card.
      // Let's create an elegant desktop detail overlay on the right-bottom side of the screen.
      // Actually, we can add a persistent floating desktop details panel in map-container for desktop.
      let desktopCard = document.getElementById('desktop-detail-card');
      if (!desktopCard) {
        desktopCard = document.createElement('div');
        desktopCard.id = 'desktop-detail-card';
        desktopCard.className = 'hidden md:flex absolute top-4 right-4 z-10 w-96 bg-white/95 backdrop-blur-md rounded-2xl border border-outline-variant/30 shadow-xl p-lg flex-col max-h-[85%] overflow-hidden';
        document.getElementById('map-container').appendChild(desktopCard);
      }

      desktopCard.innerHTML = `
        <div class="flex justify-between items-start mb-sm border-b border-outline-variant/10 pb-sm shrink-0">
          <div>
            <h3 class="font-headline-md text-on-surface font-bold text-base">${place.name}</h3>
            <p class="text-body-sm text-outline">${place.category} (거리: ${place.distance}m)</p>
          </div>
          <button id="close-desktop-card" class="text-outline hover:text-on-surface p-1 rounded-full hover:bg-surface-container-high">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="flex-1 overflow-y-auto space-y-md py-sm">
          ${menusHtml}
        </div>
      `;
      desktopCard.classList.remove('hidden');

      document.getElementById('close-desktop-card').addEventListener('click', () => {
        desktopCard.classList.add('hidden');
      });
    }

    /**
     * Generate HTML snippets for safe and unsafe menus
     */
    function generateMenusHtml(place) {
      if (!place.hasMenuData) {
        // No menu data fallback alert
        let cautionBorder = 'border-amber-300 bg-amber-50';
        let alertColor = 'text-amber-800';
        let alertIcon = 'warning';
        if (place.safety === 'safe') {
          cautionBorder = 'border-green-300 bg-green-50';
          alertColor = 'text-green-800';
          alertIcon = 'check_circle';
        }

        return `
          <div class="p-md border rounded-xl space-y-sm ${cautionBorder}">
            <div class="flex items-center gap-xs font-bold ${alertColor} text-label-lg">
              <span class="material-symbols-outlined text-[20px]">${alertIcon}</span>
              <span>식당 메뉴판 정보 없음</span>
            </div>
            <p class="text-body-sm leading-relaxed text-on-surface-variant">
              이 매장은 카카오맵에 상세 메뉴 정보가 등록되어 있지 않습니다.
              <br/><span class="font-bold underline">업종 분류 분석 결과:</span> ${place.message}
            </p>
          </div>
          <div class="pt-sm">
            <a href="${place.place_url}" target="_blank" class="w-full py-sm bg-primary text-on-primary rounded-lg font-label-md flex items-center justify-center gap-xs active:scale-95 transition-all">
              카카오맵 앱에서 직접 확인 <span class="material-symbols-outlined text-[16px]">open_in_new</span>
            </a>
          </div>
        `;
      }

      let safeSection = '';
      if (place.safeMenus.length > 0) {
        safeSection = `
          <div class="space-y-sm">
            <h5 class="text-label-lg font-bold text-[#0f683d] flex items-center gap-xs border-b border-[#24d27a]/20 pb-1">
              <span class="material-symbols-outlined text-[#0f683d] text-[18px]">check_circle</span>
              안전한 추천 메뉴 (${place.safeMenus.length}개)
            </h5>
            <div class="flex flex-wrap gap-xs">
              ${place.safeMenus.map(m => `<span class="bg-[#f1faf5] border border-[#d3eedf] px-md py-1 rounded-full text-xs font-semibold text-[#0f683d] flex items-center gap-1">${m}</span>`).join('')}
            </div>
          </div>
        `;
      }

      let unsafeSection = '';
      if (place.unsafeMenus.length > 0) {
        unsafeSection = `
          <div class="space-y-sm pt-sm">
            <h5 class="text-label-lg font-bold text-[#c62828] flex items-center gap-xs border-b border-[#e53935]/20 pb-1">
              <span class="material-symbols-outlined text-[#c62828] text-[18px]">cancel</span>
              위험 경고 메뉴 (${place.unsafeMenus.length}개)
            </h5>
            <div class="flex flex-wrap gap-xs">
              ${place.unsafeMenus.map(m => `<span class="bg-[#ffebee] border border-[#ffcdd2] px-md py-1 rounded-full text-xs font-semibold text-[#c62828] flex items-center gap-1">${m}</span>`).join('')}
            </div>
            <p class="text-[10px] text-outline-variant font-medium leading-relaxed italic">
              * 위 메뉴들에는 현재 회원님의 알레르기 설정성분(${userAllergiesList.join(', ')})이 들어있을 가능성이 높습니다.
            </p>
          </div>
        `;
      }

      return `
        <div class="space-y-md text-left">
          ${safeSection}
          ${unsafeSection}
          <div class="p-sm bg-surface-container rounded-lg text-center mt-md text-[11px] text-outline leading-relaxed">
            💡 <b>교차 오염 안내:</b> 본 결과는 기계적인 메뉴명 기반 분석입니다. 알레르기가 심각할 경우 조리실 내 교차 오염 여부를 매장에 반드시 미리 문의하시기 바랍니다.
          </div>
        </div>
      `;
    }
  </script>
