<!DOCTYPE html>
<html class="light" lang="ko">
<head>
  <meta charset="utf-8"/>
  <title>AllergyFree - 프로필 정보 수정</title>
  <link rel="icon" type="image/png" href="/image/icon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script src="../js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/auth.js" defer></script>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen pb-24">
  <!-- Top Navigation -->
  <header class="fixed top-0 left-0 w-full z-50 bg-surface dark:bg-surface-dim shadow-sm">
    <div class="max-w-container-max mx-auto w-full flex justify-between items-center px-margin-mobile py-sm">
      <div class="flex items-center gap-sm">
        <a href="/profile" class="material-symbols-outlined text-primary cursor-pointer active:scale-95 transition-transform" data-icon="arrow_back">arrow_back</a>
        <span class="text-headline-lg font-headline-lg font-bold text-primary dark:text-inverse-primary">AllergyFree</span>
      </div>
      <div class="hidden md:flex flex-1 max-w-2xl mx-lg relative">
        <input class="w-full bg-surface-container-low border-none rounded-full px-lg py-sm text-body-md focus:ring-2 focus:ring-primary-container" placeholder="상품명 또는 바코드 검색" type="text"/>
        <span class="material-symbols-outlined absolute right-4 top-2 text-outline cursor-pointer" data-icon="search">search</span>
      </div>
      <div class="flex items-center gap-md">
        <a href="/shop" class="text-primary font-bold hover:underline px-xs text-body-md flex items-center gap-xs">
          <span class="material-symbols-outlined">shopping_basket</span>
          <span class="hidden sm:inline">쇼핑몰</span>
        </a>
        <a href="/cart" class="relative cursor-pointer active:scale-95 transition-transform text-primary flex items-center justify-center p-1 rounded-full hover:bg-surface-container-high">
          <span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
          <span id="cart-badge" class="absolute -top-1 -right-1 bg-error text-on-error text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full hidden">0</span>
        </a>
        <button class="cursor-pointer active:scale-95 transition-transform text-primary">
          <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
        </button>
        <button id="header-profile-btn" class="cursor-pointer active:scale-95 transition-transform text-primary">
          <span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
        </button>
      </div>
    </div>
  </header>

  <main class="pt-[90px] px-margin-mobile max-w-[650px] mx-auto space-y-lg">
    <!-- Header Section -->
    <section class="flex items-center gap-sm">
      <a href="/profile" class="material-symbols-outlined text-outline hover:text-on-surface p-1 rounded-full hover:bg-surface-container-high transition-colors">arrow_back</a>
      <div>
        <h2 class="font-headline-lg text-headline-lg text-on-surface font-bold">프로필 정보 수정</h2>
        <p class="font-body-sm text-on-surface-variant">사용자의 상세 계정 정보 및 배송지를 관리합니다.</p>
      </div>
    </section>

    <!-- Error/Success Alerts -->
    <div id="profile-edit-error" class="hidden bg-error-container/30 border border-error text-error p-md rounded-xl text-body-md"></div>
    <div id="profile-edit-success" class="hidden bg-primary-container/20 border border-primary text-primary p-md rounded-xl text-body-md"></div>

    <form id="profile-edit-form" class="space-y-lg">
      <!-- 1. Account Info Card -->
      <div class="bg-surface-container-lowest rounded-2xl p-lg shadow-sm border border-outline-variant/30 space-y-md">
        <h3 class="font-headline-md text-headline-md text-primary font-bold flex items-center gap-xs pb-sm border-b border-outline-variant/30">
          <span class="material-symbols-outlined">manage_accounts</span>
          회원정보 / 계정 설정
        </h3>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-md">
          <div>
            <label class="block text-label-lg text-on-surface-variant mb-xs font-semibold">아이디 (ID)</label>
            <input type="text" id="edit-username" disabled
              class="w-full bg-surface-container border border-outline rounded-lg px-md py-sm text-body-md opacity-70 cursor-not-allowed focus:outline-none"/>
          </div>
          <div>
            <label class="block text-label-lg text-on-surface-variant mb-xs font-semibold">이메일 주소</label>
            <input type="email" id="edit-email" required
              class="w-full bg-surface-container-low border border-outline rounded-lg px-md py-sm text-body-md focus:ring-2 focus:ring-primary focus:outline-none transition-all"/>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-md">
          <div>
            <label class="block text-label-lg text-on-surface-variant mb-xs font-semibold">이름</label>
            <input type="text" id="edit-name" required
              class="w-full bg-surface-container-low border border-outline rounded-lg px-md py-sm text-body-md focus:ring-2 focus:ring-primary focus:outline-none transition-all"/>
          </div>
          <div>
            <label class="block text-label-lg text-on-surface-variant mb-xs font-semibold">휴대전화 번호</label>
            <input type="tel" id="edit-phone" required placeholder="010-0000-0000"
              class="w-full bg-surface-container-low border border-outline rounded-lg px-md py-sm text-body-md focus:ring-2 focus:ring-primary focus:outline-none transition-all"/>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-md">
          <div>
            <label class="block text-label-lg text-on-surface-variant mb-xs font-semibold">생년월일 (선택)</label>
            <input type="date" id="edit-birthdate"
              class="w-full bg-surface-container-low border border-outline rounded-lg px-md py-sm text-body-md focus:ring-2 focus:ring-primary focus:outline-none transition-all"/>
          </div>
          <div>
            <label class="block text-label-lg text-on-surface-variant mb-xs font-semibold">성별 (선택)</label>
            <select id="edit-gender"
              class="w-full bg-surface-container-low border border-outline rounded-lg px-md py-sm text-body-md focus:ring-2 focus:ring-primary focus:outline-none transition-all">
              <option value="">선택 안함</option>
              <option value="male">남성</option>
              <option value="female">여성</option>
              <option value="other">기타</option>
            </select>
          </div>
        </div>

        <div class="border-t border-outline-variant/30 pt-md mt-md space-y-sm">
          <h4 class="text-label-lg text-primary font-bold">비밀번호 변경 (선택)</h4>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-md">
            <div>
              <label class="block text-label-sm text-on-surface-variant mb-xs font-semibold">기존 비밀번호</label>
              <input type="password" id="edit-current-password" placeholder="기존 비밀번호 입력"
                class="w-full bg-surface-container-low border border-outline rounded-lg px-md py-sm text-body-sm focus:ring-2 focus:ring-primary focus:outline-none transition-all"/>
            </div>
            <div>
              <label class="block text-label-sm text-on-surface-variant mb-xs font-semibold">새로운 비밀번호</label>
              <input type="password" id="edit-new-password" placeholder="최소 6자 이상"
                class="w-full bg-surface-container-low border border-outline rounded-lg px-md py-sm text-body-sm focus:ring-2 focus:ring-primary focus:outline-none transition-all"/>
            </div>
            <div>
              <label class="block text-label-sm text-on-surface-variant mb-xs font-semibold">새로운 비밀번호 재입력</label>
              <input type="password" id="edit-confirm-password" placeholder="새로운 비밀번호 재입력"
                class="w-full bg-surface-container-low border border-outline rounded-lg px-md py-sm text-body-sm focus:ring-2 focus:ring-primary focus:outline-none transition-all"/>
            </div>
          </div>
        </div>
      </div>

      <!-- 2. Delivery Info Card -->
      <div class="bg-surface-container-lowest rounded-2xl p-lg shadow-sm border border-outline-variant/30 space-y-md">
        <h3 class="font-headline-md text-headline-md text-primary font-bold flex items-center gap-xs pb-sm border-b border-outline-variant/30">
          <span class="material-symbols-outlined">local_shipping</span>
          배송지 정보 설정
        </h3>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-md">
          <div>
            <label class="block text-label-lg text-on-surface-variant mb-xs font-semibold">수령인 이름</label>
            <input type="text" id="edit-recipient-name"
              class="w-full bg-surface-container-low border border-outline rounded-lg px-md py-sm text-body-md focus:ring-2 focus:ring-primary focus:outline-none transition-all"/>
          </div>
          <div>
            <label class="block text-label-lg text-on-surface-variant mb-xs font-semibold">배송지 연락처</label>
            <input type="tel" id="edit-contact-phone" placeholder="010-0000-0000"
              class="w-full bg-surface-container-low border border-outline rounded-lg px-md py-sm text-body-md focus:ring-2 focus:ring-primary focus:outline-none transition-all"/>
          </div>
        </div>

        <div class="grid grid-cols-4 gap-sm">
          <div class="col-span-3">
            <label class="block text-label-lg text-on-surface-variant mb-xs font-semibold">우편번호</label>
            <input type="text" id="edit-zipcode" placeholder="우편번호"
              class="w-full bg-surface-container-low border border-outline rounded-lg px-md py-sm text-body-md focus:ring-2 focus:ring-primary focus:outline-none transition-all"/>
          </div>
          <div class="flex items-end">
            <button type="button" onclick="alert('카카오 우편번호 API 연동 대기중 - 임의의 번호를 입력해주세요.')"
              class="w-full bg-secondary-container hover:bg-opacity-90 text-on-secondary-container font-label-lg py-3 rounded-lg active:scale-95 transition-all">
              검색
            </button>
          </div>
        </div>

        <div>
          <label class="block text-label-lg text-on-surface-variant mb-xs font-semibold">기본 배송지 주소</label>
          <input type="text" id="edit-address" placeholder="도로명 주소 또는 지번 주소"
            class="w-full bg-surface-container-low border border-outline rounded-lg px-md py-sm text-body-md focus:ring-2 focus:ring-primary focus:outline-none transition-all"/>
        </div>

        <div>
          <label class="block text-label-lg text-on-surface-variant mb-xs font-semibold">상세 주소</label>
          <input type="text" id="edit-detail-address" placeholder="동, 호수, 건물명 등 상세주소 입력"
            class="w-full bg-surface-container-low border border-outline rounded-lg px-md py-sm text-body-md focus:ring-2 focus:ring-primary focus:outline-none transition-all"/>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-md pt-md">
        <a href="/profile"
          class="flex-1 h-14 bg-surface-container-high text-on-surface rounded-xl font-label-lg flex items-center justify-center border-2 border-outline-variant hover:bg-surface-container transition-all active:scale-[0.98]">
          취소
        </a>
        <button type="submit"
          class="flex-1 h-14 bg-primary text-on-primary rounded-xl font-label-lg shadow-md hover:bg-opacity-95 transition-all active:scale-[0.98]">
          정보 저장하기
        </button>
      </div>
    </form>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface-container-lowest shadow-[0_-4px_12px_rgba(0,0,0,0.04)] rounded-t-xl">
    <a href="/shop" class="flex flex-col items-center justify-center text-on-surface-variant active:scale-90 transition-all duration-150 cursor-pointer">
      <span class="material-symbols-outlined" data-icon="shopping_basket">shopping_basket</span>
      <span class="font-label-sm text-label-sm">Shop</span>
    </a>
    <a href="/scan" class="flex flex-col items-center justify-center text-on-surface-variant active:scale-90 transition-all duration-150 cursor-pointer">
      <span class="material-symbols-outlined" data-icon="barcode_scanner">barcode_scanner</span>
      <span class="font-label-sm text-label-sm">Scan</span>
    </a>
    <a href="/viewed_products" class="flex flex-col items-center justify-center text-on-surface-variant active:scale-90 transition-all duration-150 cursor-pointer">
      <span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
      <span class="font-label-sm text-label-sm">My Pantry</span>
    </a>
    <a href="/profile" class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 active:scale-90 transition-all duration-150 cursor-pointer">
      <span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
      <span class="font-label-sm text-label-sm">Profile</span>
    </a>
  </nav>
</body>
</html>
